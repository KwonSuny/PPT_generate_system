<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初始化 · PPT 生成器</title>
  <style>
    :root {
      --brand: #2563eb;
      --brand-deep: #1e40af;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f4f6fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
      max-width: 780px;
      width: 100%;
    }
    .brand {
      background: linear-gradient(160deg, #1d4ed8 0%, #3b82f6 55%, #60a5fa 100%);
      color: #fff;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand .logo {
      width: 52px; height: 52px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.18);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .brand h1 { font-size: 24px; font-weight: 600; letter-spacing: 0.5px; }
    .brand .slogan { margin-top: 12px; font-size: 14px; opacity: 0.85; line-height: 1.7; }
    .brand .foot { font-size: 12px; opacity: 0.7; margin-top: 32px; }
    .form {
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .form h2 { font-size: 19px; font-weight: 600; margin-bottom: 8px; }
    .form .desc { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 24px; }
    label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 8px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 10px;
      font-size: 14px; outline: none; transition: border .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .row input { flex: 1; }
    .eye {
      flex: none; width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff; cursor: pointer;
      font-size: 16px; color: var(--muted);
    }
    button.primary {
      margin-top: 24px; padding: 13px 16px; border: none; border-radius: 10px;
      background: var(--brand); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button.primary:hover { background: var(--brand-deep); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
    .hint a { color: var(--brand); text-decoration: none; }
    .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .msg.err { color: #dc2626; }
    .msg.ok { color: #16a34a; }
    .configured {
      margin-top: 24px; padding: 14px; border-radius: 10px;
      background: #ecfdf3; color: #166534; font-size: 14px; line-height: 1.6;
    }
    @media (max-width: 640px) {
      .card { grid-template-columns: 1fr; }
      .brand { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <aside class="brand">
      <div>
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
        </div>
        <h1>PPT 生成器</h1>
        <p class="slogan">基于多智能体协作的一键演示文稿生成与精细化编辑工具</p>
      </div>
      <div class="foot">Planner · Writer · Layout 三 Agent 架构</div>
    </aside>

    <div class="form">
      <h2>连接你的模型服务</h2>
      <p class="desc">首次使用需配置 DashScope API Key，用于驱动内容规划、文案撰写与视觉排版智能体。密钥仅以加密形式保存在本机，不会上传。</p>

      <label for="apikey">DashScope API Key</label>
      <div class="row">
        <input id="apikey" type="password" placeholder="sk-..." autocomplete="off" />
        <button class="eye" id="toggle" type="button" title="显示/隐藏">👁</button>
      </div>

      <label for="baseurl" style="margin-top: 16px;">模型服务地址（可选）</label>
      <input id="baseurl" type="text" placeholder="留空使用默认服务地址" autocomplete="off" />

      <div class="msg" id="msg"></div>
      <button class="primary" id="save">保存并进入</button>

      <div id="configured" class="configured" style="display:none;">
        已检测到本机密钥，点击下方按钮直接进入。
      </div>

      <p class="hint">
        还没有密钥？前往 <a href="#">阿里云百炼控制台</a> 创建 API Key。
        密钥使用 Windows 数据保护（DPAPI）加密后保存在项目目录的 <code>config/config.json</code>，仅本机本账户可解密；换账户或换机器后需重新输入。
      </p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    $('toggle').addEventListener('click', () => {
      const inp = $('apikey');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    async function submitKey() {
      const key = $('apikey').value.trim();
      const baseurl = $('baseurl').value.trim();
      const msg = $('msg');
      msg.className = 'msg';
      msg.textContent = '';
      if (!key) { msg.className = 'msg err'; msg.textContent = '请输入 API Key'; return; }
      const btn = $('save');
      btn.disabled = true;
      btn.textContent = '正在保存…';
      try {
        const resp = await fetch('/api/save_key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: key, base_url: baseurl }),
        });
        const data = await resp.json();
        if (resp.ok && data.status === 'success') {
          msg.className = 'msg ok';
          msg.textContent = '保存成功，正在进入…';
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          msg.className = 'msg err';
          msg.textContent = data.message || '保存失败，请重试';
          btn.disabled = false;
          btn.textContent = '保存并进入';
        }
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = '网络异常，请重试';
        btn.disabled = false;
        btn.textContent = '保存并进入';
      }
    }

    $('save').addEventListener('click', submitKey);

    fetch('/api/has_key')
      .then((r) => r.json())
      .then((d) => {
        if (d.base_url) {
          $('baseurl').value = d.base_url;
        }
        if (d.has_key) {
          $('configured').style.display = 'block';
          $('save').textContent = '直接进入';
          $('save').onclick = () => { window.location.href = '/'; };
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
